[project]
name = "vidtoolz-resize"
version = "0.1.0"
description = "Resize video using python"
readme = "README.md"
authors = [{name = "Sukhbinder Singh"}]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License"
]
dependencies = [
    "vidtoolz",
]

[project.urls]
Homepage = "https://github.com/sukhbinder/vidtoolz-resize"
Changelog = "https://github.com/sukhbinder/vidtoolz-resize/releases"
Issues = "https://github.com/sukhbinder/vidtoolz-resize/issues"
CI = "https://github.com/sukhbinder/vidtoolz-resize/actions"

[project.entry-points."vidtoolz_plugins"]
resize = "vidtoolz_resize:resize_plugin"


[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
